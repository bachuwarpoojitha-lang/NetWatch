<h2>Dataset mapping</h2><p>Dataset 1 uses timestamp, src_ip, dst_ip, src_port, dst_port, protocol, bytes, packets, status, dns_query. Dataset 2 uses FlowStart (epoch seconds), Initiator, Responder, InitPort, RespPort, L4, OctetsTotal, Pkts, Verdict (ALLOW/DENY), QName. Both map to one internal record (ts, src, dst, sport, dport, protocol, bytes, packets, status, dns). Mapping order: built-in aliases, then aliases from settings (currently: ${Object.entries(C.cm).map(([k,v])=>k+'='+v.join('|')).join('; ')||'none'}), then fuzzy name matching, then manual selection. Timestamps accept ISO, epoch seconds or milliseconds, and day/month/year text.</p>

const csvA=()=>['id,rule,host,start,end,observed,baseline,approved_activity,reason,detail'].concat(S.al.map(a=>[a.id,RN[a.rule],a.host,fT(a.t0),fT(a.t1),a.obs,a.base,a.ap,a.why||'',a.detail].map(q).join(','))).join('\n');
const csvI=()=>['id,host,start,end,score,severity,rules,destinations,score_explanation'].concat(S.inc.map(i=>[i.id,i.host,fT(i.t0),fT(i.t1),i.score,i.sev,i.rules.map(r=>RN[r]).join('; '),i.dsts.slice(0,20).join(' '),i.ex.join('; ')].map(q).join(','))).join('\n');
function repHTML(){return `<h2>NetWatch investigation report</h2><p>Learning period: ${fT(S.t0)} to ${fT(S.split)}. Evaluation period: ${fT(S.split)} to ${fT(S.t1)}. ${S.ok.length.toLocaleString()} valid records, ${S.rej.length} rejected. ${S.al.length} alerts grouped into ${S.inc.length} incidents.</p>${S.inc.map(i=>`<h3>${i.id}: ${i.host} (${i.sev}, score ${i.score}/100)</h3><p>${fT(i.t0)} to ${fT(i.t1)}. Rules: ${i.rules.map(r=>RN[r]).join(', ')}.</p><ul>${i.al.slice(0,5).map(a=>`<li>${RN[a.rule]}: observed ${esc(a.obs)}; baseline ${esc(a.base)}${a.ap?' (legitimate: '+esc(a.why)+')':''}</li>`).join('')}</ul><p>Score: ${esc(i.ex.join('; '))}</p><p>Possible benign explanations: ${i.rules.map(r=>BEN[r]).join('; ')}.</p>`).join('')}<h3>Limitations</h3><ul><li>Scores show investigation priority, not the probability of an attack.</li><li>Hosts with little learning data fall back to global baselines.</li><li>Only windows with traffic contribute to baselines.</li><li>DNS and failed-connection rules need DNS or status columns.</li><li>Thresholds are configurable and were set to: ports ${C.ports}, transfer ${C.bytesMult}x baseline, sweep ${C.sweepHosts} hosts, spread ${C.spreadHosts} targets.</li></ul>`}
function dl(n,t){$('#out').value=t;try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t]));a.download=n;a.click()}catch(e){}}
function cp(){const o=$('#out');o.select();try{navigator.clipboard.writeText(o.value)}catch(e){document.execCommand('copy')}}
function rep(){return `<div class="card"><h2>Export</h2><div class="row"><button class="b" onclick="dl('anomalies.csv',csvA())">Anomalies CSV</button><button class="b" onclick="dl('incidents.csv',csvI())">Incidents CSV</button><button class="b" onclick="dl('netwatch-report.html','<!doctype html><meta charset=utf-8><title>NetWatch report</title>'+repHTML())">HTML report</button><button class="b s" onclick="window.print()">Print</button><button class="b s" onclick="cp()">Copy export text</button></div><p class="mu">If your browser blocks the download, the text appears below. Copy it and save it as a file.</p><textarea id="out" readonly></textarea></div><div class="card">${repHTML()}</div>`}

async function runBackendAnalysis(){
  if(!S.ok.length){msg('Load and validate a dataset first, then send valid records to the backend.');return}
  S.backendLoading=true; S.backendError=''; S.backendResult=null;
  if(S.tab==='backend')draw();
  try{
    const response=await fetch('http://localhost:5000/api/analyze',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({records:S.ok,config:{
        learnPct:C.learnPct,window:C.window,bytesMult:C.bytesMult,minBytes:C.minBytes,
        ports:C.ports,destMult:C.destMult,minDest:C.minDest,dnsMult:C.dnsMult,minDns:C.minDns,
        failMult:C.failMult,minFail:C.minFail,sweepHosts:C.sweepHosts,spreadHosts:C.spreadHosts
      }})
    });
    const data=await response.json();
    if(!response.ok) throw new Error(data.error||('HTTP '+response.status));
    S.backendResult=data; S.backendLoading=false; S.tab='backend'; draw();
  }catch(e){
    S.backendLoading=false; S.backendError='Could not reach the backend. Start the server with npm run dev and make sure it listens on port 5000. Details: '+e.message;
    S.tab='backend'; draw();
  }
}
function backendP(){
  if(S.backendLoading)return '<div class="card"><h2>Backend analysis</h2><p>Sending records to the Express API…</p></div>';
  if(S.backendError)return '<div class="card"><h2>Backend connection error</h2><div class="warn">'+esc(S.backendError)+'</div><button class="b" onclick="runBackendAnalysis()">Try again</button></div>';
  if(!S.backendResult)return '<div class="card"><h2>Backend API</h2><p class="mu">Load a CSV, validate it, then choose “Send valid records to backend”. The Express API runs a separate server-side anomaly pass.</p><button class="b" onclick="runBackendAnalysis()">Run backend analysis</button></div>';
  const r=S.backendResult;
  return '<div class="card"><h2>Server-side analysis results</h2><p>Processed <b>'+r.recordsProcessed+'</b> records across <b>'+r.hostsAnalyzed+'</b> source hosts. Found <b>'+r.anomalies.length+'</b> anomaly findings. This is a rule-based investigation aid, not proof of an attack.</p><div class="row"><button class="b" onclick="runBackendAnalysis()">Run again</button><button class="b s" onclick="S.tab=&quot;inc&quot;;draw()">View browser-side incidents</button></div></div>'+
    '<div class="card"><h2>Backend findings</h2><div class="w"><table><tr><th>Severity</th><th>Source host</th><th>Rule</th><th>Observed evidence</th><th>Baseline / threshold</th><th>Next step</th></tr>'+
    (r.anomalies.map(a=>'<tr><td>'+esc(a.severity)+'</td><td>'+esc(a.host)+'</td><td>'+esc(a.rule)+'</td><td>'+esc(a.observed)+'</td><td>'+esc(a.baseline)+'</td><td>'+esc(a.recommendation)+'</td></tr>').join('')||'<tr><td colspan="6">No backend rules triggered for this dataset.</td></tr>')+
    '</table></div><p class="mu">Backend findings are independently calculated from the submitted records. Thresholds and results can differ from the browser analysis.</p></div>';
}

addEventListener('error',e=>{const b=document.getElementById('m');if(b)b.insertAdjacentHTML('afterbegin','<div class="warn" role="alert">Error: '+esc(e.message)+'</div>')});
addEventListener('paste',e=>{const t=e.target;if(t&&(t.tagName=='TEXTAREA'||t.tagName=='INPUT'))return;const x=e.clipboardData&&e.clipboardData.getData('text');if(x&&x.indexOf('\n')>0){e.preventDefault();S.paste=x;S.fn='Pasted text';load(x)}});
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)up(f)});
draw();
